# Deploy scalaxy.org to Cloudflare Pages via Wrangler.
#
# Only needed if you are NOT using the Cloudflare Pages Git integration
# (which deploys automatically on push). If Git integration is enabled,
# delete this file to avoid double deployments.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  - API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account id

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true
      - name: Build
        run: hugo --minify
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name scalaxy-org
