baseURL = "https://scalaxy.org/"
languageCode = "en-us"
title = "Scalaxy"
theme = "scalaxy"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "A distributed key/value database written in Common Lisp: one binary, a built-in web console, no external dependencies."
  version = "1.6.7"
  repo = "https://github.com/scalaxy/scalaxy"
  domain = "scalaxy.org"
  author = "Artem Andreenko"
  author_github = "miolini"

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 10
  [[menu.main]]
    name = "Use Cases"
    pageRef = "/use-cases"
    weight = 20
  [[menu.main]]
    name = "Topologies"
    pageRef = "/topologies"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github"
    codeFences = true
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
