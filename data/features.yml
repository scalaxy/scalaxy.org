- icon: '<circle cx="12" cy="12" r="9"/><circle cx="5.5" cy="5.5" r="1.5"/><circle cx="18.5" cy="5.5" r="1.5"/><circle cx="12" cy="17" r="1.5"/><path d="M6.5 6.5l5.5 9M17.5 6.5l-5.5 9"/>'
  title: Property graph store
  text: "Nodes, relationships, labels, and properties live in the same durable store as key/value data."
- icon: '<path d="M3 17l6-6 4 4 8-8M14 7h7v7"/>'
  title: openCypher query language
  text: "Query graphs with openCypher through REST, the Lisp client, TCP, or the web console. The local TCK runner covers 3,898 scenarios; current results are in the Cypher documentation."
- icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3 12h7M14 12h7"/>'
  title: Consistent-hash sharding
  text: "Keys and graph records are placed on a virtual-node ring. Adding a node moves about 1/N of the keyspace."
- icon: '<path d="M20 12H8M12 6l-6 6 6 6"/><path d="M4 12h8"/>'
  title: Synchronous replication
  text: Writes are copied to the configured replica before the client receives an acknowledgement. Reads can fall back to a replica when the owner is unavailable.
- icon: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'
  title: Durable by default
  text: Writes go to an append-only log and are replayed on startup. Acknowledged writes survive a node restart.
- icon: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8M12 17v3"/>'
  title: Web console included
  text: "Each node serves an HTTP console with a cluster view, data browser, topology view, and command console. There is no separate frontend to deploy."
- icon: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>'
  title: Runs in containers
  text: The repository includes Docker, docker-compose, and Kubernetes manifests. Configure the node with environment variables.
- icon: '<path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/>'
  title: In-tree runtime
  text: The core is ANSI Common Lisp; JSON and HTTP are implemented in the repository. SBCL is the supported runtime.
