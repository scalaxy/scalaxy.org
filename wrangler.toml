# Cloudflare Pages project configuration (wrangler)
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# NOTE: this project must be created as a CLOUDFLARE PAGES project.
# If the dashboard ever shows "Executing user deploy command: npx wrangler deploy",
# the project is configured as a Workers project (Workers Builds), which is wrong
# for this repository and will fail with "Missing entry-point".

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "scalaxy-org"
pages_build_output_dir = "./public"
compatibility_date = "2026-08-07"

[observability]
enabled = true
